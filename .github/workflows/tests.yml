name: RVOS tests

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        # NDA fixtures (Docs/Test/*.txt) are gitignored and not present
        # here, so these will SKIP, not PASS. That's expected -- see
        # CLAUDE.md. This step still catches import errors, syntax
        # errors, and dependency drift.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -v
